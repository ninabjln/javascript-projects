<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <p class="title">Rock Paper Scissors</p>

    <button class="move-button js-rock-button">
      <img class="move-icon" src="./assets/rock-emoji.png" alt="Rock emoji" />
    </button>

    <button class="move-button js-paper-button" onclick="playGame('Paper')">
      <img
        class="move-icon"
        src="./assets/paper-emoji.png"
        alt="Paper emoji"
      />
    </button>

    <button class="move-button js-scissors-button" onclick="">
      <img
        class="move-icon"
        src="./assets/scissors-emoji.png"
        alt="Scissors emoji"
      />
    </button>

    <p class="js-result result"></p>

    <p class="js-moves"></p>

    <p></p>

    <p class="js-score score"></p>

    <button
      class="reset-score-button"
      onclick="
        score.Wins = 0;
        score.Losses = 0;
        score.Ties = 0;
        localStorage.removeItem('score');
        updateScoreElement();
      "
    >
      Reset Score
    </button>

    <button
    class="autoplay-button js-autoplay">
      Outo Play
    </button>

    <script src="script.js"></script>
  </body>
</html>
