<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify Clone</title>
    <link rel="stylesheet" href="./styles/navbar.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav>
      <div class="nav-left">
        <div class="spotify-logo"><i class="fa-brands fa-spotify"></i></div>
        <div class="search-box">
          <div class="search-button">
            <i class="fa-solid fa-magnifying-glass"></i>
          </div>
          <input
            type="text"
            class="search-input"
            placeholder="what do you want  to play?"
          />
          <div class="browse-button">
            <i class="fa-solid fa-folder-open"></i>
          </div>
        </div>
      </div>
      <div class="menu-toggle menu-toggle-js">
        <i class="fa-solid fa-bars-staggered"></i>
      </div>
      <div class="nav-right">
        <div class="nav-links">
          <p>Premium</p>
          <p>Support</p>
          <p>Download</p>
        </div>
        <div class="nav-actions">
          <div class="install-app">
            <i class="fa-regular fa-circle-down"></i><span>Install App</span>
          </div>
          <div class="signup-link">Sign up</div>
          <button class="login-button">Log in</button>
        </div>
      </div>

      <div class="mobile-menu mobile-menu-js">
        <div class="menu-close menu-close-js">
          <i class="fa-solid fa-xmark"></i>
        </div>
        <ul class="mobile-menu-list">
          <li><a href="#"></a>Premium</li>
          <li><a href="#"></a>Support</li>
          <li><a href="#"></a>Download</li>
          <li>
            <a href="#"></a><i class="fa-regular fa-circle-down"></i>Install App
          </li>
          <li><a href="#"></a>Sign up</li>
          <button class="login-button">Log in</button>
        </ul>
      </div>
    </nav>

    <script src="script.js"></script>
  </body>
</html>
