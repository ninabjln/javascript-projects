<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify Clone</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav>
      <div class="left-section">
        <div class="logo-icon"><i class="fa-brands fa-spotify"></i></div>
        <div class="home-icon"><i class="fa-solid fa-house"></i></div>
        <div class="search-bar">
          <div class="search-icon">
            <i class="fa-solid fa-magnifying-glass"></i>
          </div>
          <input
            type="text"
            class="input-box"
            placeholder="what do you want  to play?"
          />
          <div class="browser-icon">
            <i class="fa-solid fa-folder-open"></i>
          </div>
        </div>
      </div>
      <div class="right-section">
        <div class="right-section-p1">
          <p>Premium</p>
          <p>Support</p>
          <p>Download</p>
        </div>
        <div class="right-section-p2">
          <div class="install">
            <i class="fa-regular fa-circle-down"></i> Install App
          </div>
          <div class="sign-up">Sign up</div>
          <button class="log-in-button">Log in</button>
        </div>
      </div>
      <div class="hamburger-menu">
        <i class="fa-solid fa-bars-staggered"></i>
      </div>
    </nav>

    <script></script>
  </body>
</html>
